<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المضيوب - النظام المحاسبي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- كاشف الأخطاء التلقائي لمعرفة سبب الشاشة البيضاء على الجوال -->
    <script>
      window.onerror = function(msg, url, line) {
        alert("خطأ في التطبيق: " + msg + "\nفي الملف: " + url + "\nالسطر: " + line);
      };
    </script>
</head>
<body>
    <div id="app">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-view" class="view hidden">
            <div class="auth-card">
                <h1>المضيوب</h1>
                <p>نظام محاسبي بقيد مزدوج</p>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
                    <input type="password" id="login-password" placeholder="كلمة المرور" required>
                    <button type="submit" class="btn-primary">دخول</button>
                </form>
                <p id="auth-error" class="error-msg"></p>
            </div>
        </div>

        <!-- شاشة التطبيق الرئيسية -->
        <div id="app-view" class="view hidden">
            <header class="app-header">
                <h2 id="org-name">جاري التحميل...</h2>
                <button id="logout-btn" class="btn-icon">خروج</button>
            </header>

            <main id="page-content" class="app-content">
                <!-- المحتوى يتغير ديناميكياً -->
            </main>

            <nav class="bottom-nav">
                <button class="nav-btn active" data-page="dashboard">الرئيسية</button>
                <button class="nav-btn" data-page="parties">الجهات</button>
                <button class="nav-btn" data-page="inventory">المخزون</button>
                <button class="nav-btn" data-page="journal">القيود</button>
                <button class="nav-btn" data-page="settings">الإعدادات</button>
            </nav>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
